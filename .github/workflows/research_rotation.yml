name: Rotation research

# Tests an active rotation picker (no selling because a stock turned bad) on past prices.
# Runs by itself whenever research.py changes, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [research_rotation.py]

permissions:
  contents: write

concurrency:
  group: research-rotation
  cancel-in-progress: false

jobs:
  rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python research_rotation.py | tee research_rotation_log.txt
      - name: Save results
        run: |
          git config user.name "paper-trader bot"
          git config user.email "actions@users.noreply.github.com"
          git add research_rotation.json research_rotation_log.txt
          git commit -m "Rotation research results" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
