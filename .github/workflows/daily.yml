name: Daily paper trade and website

# Runs every weekday at 21:30 UTC (about 5:30pm New York time in summer,
# 4:30pm in winter), after the US stock market has closed, then updates the website.
# You can also run it by hand from the Actions tab ("Run workflow").
# It also republishes the website whenever index.html changes.
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-trader
  cancel-in-progress: false

jobs:
  paper-trade:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      TICKERS: "AAPL MSFT NVDA AMZN GOOGL META JPM GS XOM COST"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run the S&P 500 picker (fake money, holds 10 at a time)
        run: python sp500_picker.py daily --state state_picker.json
      - name: Run the buy-and-hold bot (the original 10 stocks)
        run: python paper_trader.py daily --tickers $TICKERS --strategy hold --state state_hold.json
      - name: Save the portfolios back to the repo
        run: |
          git config user.name "paper-trader bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_*.json sp500.txt
          git diff --cached --quiet || (git commit -m "Daily paper trade update" && git push)

  website:
    needs: paper-trade
    if: ${{ !cancelled() && (needs.paper-trade.result == 'success' || needs.paper-trade.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect the website files
        run: |
          mkdir site
          cp index.html site/
          cp state_hold.json state_picker.json site/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
